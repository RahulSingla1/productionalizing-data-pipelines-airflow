name: Build Kitchen Book Android app

on:
  push:
    paths:
      - "cloud-kitchen-app/android/**"
      - ".github/workflows/kitchen-android.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-kitchen-app/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the app
        run: gradle assembleRelease --no-daemon

      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk KitchenBook.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KitchenBook-apk
          path: cloud-kitchen-app/android/KitchenBook.apk

      - name: Publish a download link (Releases page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete kitchen-app --yes --cleanup-tag || true
          gh release create kitchen-app KitchenBook.apk \
            --title "Kitchen Book app (Android)" \
            --notes "Open this page on the Android phone and tap KitchenBook.apk to download and install. Built from ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"

  web:
    # The same screens as a website, so the app also opens in any browser (iPhone, laptop).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish the web version to the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp -r cloud-kitchen-app/android/app/src/main/assets site
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Kitchen Book web version from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Turn on GitHub Pages for gh-pages (works only if this token may; otherwise switch it on once in Settings → Pages)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1 \
            || gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" \
            || echo "::notice::Switch on GitHub Pages once: Settings → Pages → Deploy from a branch → gh-pages / (root)"
