<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c2410c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Kitchen Desk</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <img src="/icon.svg" alt="" width="56" height="56">
      <h1>Kitchen Desk</h1>
      <p class="muted">Sales, prices and open items from your WhatsApp group.</p>
      <label>Password <input type="password" name="password" autocomplete="current-password" required autofocus></label>
      <button class="btn primary" type="submit">Log in</button>
      <p class="error" id="login-error"></p>
    </form>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <h1 id="page-title">Today</h1>
      <div id="page-actions"></div>
    </header>
    <main id="view" class="view"></main>
    <nav class="tabs" id="tabs">
      <a href="#/today" data-tab="today"><span class="ico">◉</span>Today</a>
      <a href="#/sales" data-tab="sales"><span class="ico">₹</span>Sales</a>
      <a href="#/open" data-tab="open"><span class="ico">✓</span>Open</a>
      <a href="#/menu" data-tab="menu"><span class="ico">☰</span>Menu</a>
      <a href="#/more" data-tab="more"><span class="ico">⋯</span>More</a>
    </nav>
  </div>

  <dialog id="dialog">
    <form method="dialog" id="dialog-form">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <p class="error" id="dialog-error"></p>
      <div class="dialog-actions">
        <button type="button" class="btn danger" id="dialog-delete" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="dialog-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="dialog-save">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
